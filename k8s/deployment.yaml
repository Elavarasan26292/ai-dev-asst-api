apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-dev-asst-api
  namespace: default
  labels:
    app: ai-dev-asst-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-dev-asst-api
  template:
    metadata:
      labels:
        app: ai-dev-asst-api
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: ai-dev-asst-api
      containers:
        - name: ai-dev-asst-api
          image: devasst.azurecr.io/ai-dev-asst-api:${IMAGE_TAG}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: KeyVault__VaultUri
              value: "${KEY_VAULT_URI}"
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
