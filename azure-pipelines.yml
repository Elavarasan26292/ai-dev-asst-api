trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

variables:
  dotnetVersion: "8.0.x"
  projectFile: "ai-dev-asst-api.csproj"
  dockerRegistryServiceConnection: "devasst-acr-connection"
  azureSubscriptionServiceConnection: "devasst-aks-connection"
  azureResourceGroup: "VisualStudioOnline-C40A3787E31A48EEBA3DE3DDB8EF0511"
  kubernetesCluster: "devasst-aks"
  keyVaultUri: "https://appsecrt.vault.azure.net/"
  managedIdentityClientId: "538e6821-84f7-44a5-b6db-608f2eb3dc2b"
  imageRepository: "ai-dev-asst-api"
  imageTag: "$(Build.BuildId)"

steps:
  - task: UseDotNet@2
    displayName: Install .NET SDK 8
    inputs:
      packageType: sdk
      version: $(dotnetVersion)

  - task: DotNetCoreCLI@2
    displayName: Restore dependencies
    inputs:
      command: restore
      projects: $(projectFile)

  - task: DotNetCoreCLI@2
    displayName: Build API
    inputs:
      command: build
      projects: $(projectFile)
      arguments: "--configuration Release --no-restore"

  - task: DotNetCoreCLI@2
    displayName: Run tests
    inputs:
      command: test
      projects: $(projectFile)
      arguments: "--configuration Release --no-build --no-restore"
      publishTestResults: true

  - task: Docker@2
    displayName: Build and push API image
    inputs:
      command: buildAndPush
      containerRegistry: $(dockerRegistryServiceConnection)
      repository: $(imageRepository)
      Dockerfile: "$(Build.SourcesDirectory)/Dockerfile"
      buildContext: "$(Build.SourcesDirectory)"
      tags: |
        $(imageTag)
        latest

  - bash: |
      set -euo pipefail

      if [[ "$(keyVaultUri)" == *REPLACE_WITH_* || "$(managedIdentityClientId)" == *REPLACE_WITH_* ]]; then
        echo "Set keyVaultUri and managedIdentityClientId in the pipeline variables before deployment."
        exit 1
      fi

      export IMAGE_TAG="$(imageTag)"
      export KEY_VAULT_URI="$(keyVaultUri)"
      export MANAGED_IDENTITY_CLIENT_ID="$(managedIdentityClientId)"
      mkdir -p "$(Build.ArtifactStagingDirectory)/k8s"

      for manifest in service-account.yaml deployment.yaml service.yaml; do
        envsubst '${IMAGE_TAG} ${KEY_VAULT_URI} ${MANAGED_IDENTITY_CLIENT_ID}' \
          < "$(Build.SourcesDirectory)/k8s/${manifest}" \
          > "$(Build.ArtifactStagingDirectory)/k8s/${manifest}"
      done
    displayName: Render Kubernetes manifests

  - task: KubernetesManifest@1
    displayName: Deploy API to AKS
    inputs:
      action: deploy
      azureSubscriptionConnection: $(azureSubscriptionServiceConnection)
      azureResourceGroup: $(azureResourceGroup)
      kubernetesCluster: $(kubernetesCluster)
      namespace: default
      manifests: |
        $(Build.ArtifactStagingDirectory)/k8s/service-account.yaml
        $(Build.ArtifactStagingDirectory)/k8s/deployment.yaml
        $(Build.ArtifactStagingDirectory)/k8s/service.yaml
      containers: |
        devasst.azurecr.io/$(imageRepository):$(imageTag)
